[package]
name = "dayplanner"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
uuid = { version = "1.10", features = ["v4"] }
directories-next = "2.0"
clap = { version = "4.5", features = ["derive"] }
